name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Assemble package
        run: |
          mkdir -p package/siku_radio/web
          for entry in client server shared config translations; do
            [ -d "$entry" ] && cp -r "$entry" package/siku_radio/
          done
          cp fxmanifest.lua README.md package/siku_radio/
          cp -r web/dist package/siku_radio/web/dist
          cd package
          zip -r ../siku_radio.zip siku_radio

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" siku_radio.zip --clobber
